name: 定时代理测试与自动更新

permissions:
  contents: write
  actions: write

on:
  schedule:
    # 每天北京时间 23:00 (UTC 15:00) 自动运行一次
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: '指定测试目标网址 (输入 "all" 并发测试全部 11 个站点，或输入单个/多个逗号分隔 URL)'
        required: false
        default: 'all'
      target_count:
        description: '每个站点期望可用数量'
        required: false
        default: '1000'
      force_fetch:
        description: '是否强制重新抓取网络源'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  prepare_matrix:
    name: 准备测试矩阵
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.set-matrix.outputs.targets }}
      target_count: ${{ steps.set-matrix.outputs.target_count }}
      force_fetch: ${{ steps.set-matrix.outputs.force_fetch }}
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 解析测试站点列表
        id: set-matrix
        env:
          INPUT_TARGET_URL: ${{ github.event.inputs.target_url || 'all' }}
          INPUT_TARGET_COUNT: ${{ github.event.inputs.target_count || '1000' }}
          INPUT_FORCE_FETCH: ${{ github.event.inputs.force_fetch || 'true' }}
        run: |
          python -c "
          import json, os, sys, importlib.util
          from urllib.parse import urlparse

          spec = importlib.util.spec_from_file_location('proxy_test_config', 'proxy_test/config.py')
          config = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(config)
          DEFAULT_CRAWLER_TARGETS = config.DEFAULT_CRAWLER_TARGETS

          target_input = os.environ.get('INPUT_TARGET_URL', 'all').strip()
          target_count = os.environ.get('INPUT_TARGET_COUNT', '1000').strip()
          force_fetch = os.environ.get('INPUT_FORCE_FETCH', 'true').strip()

          if target_input.lower() in ('all', 'default', '*', ''):
              targets = DEFAULT_CRAWLER_TARGETS
          else:
              targets = []
              for u in target_input.split(','):
                  u = u.strip()
                  if u:
                      source = urlparse(u).netloc.replace(':', '_').replace('.', '_') or 'custom'
                      targets.append({'source': source, 'name': urlparse(u).netloc or u, 'url': u})
          
          matrix_json = json.dumps(targets, ensure_ascii=False)
          print(f'Matrix targets: {matrix_json}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'targets={matrix_json}\n')
              f.write(f'target_count={target_count}\n')
              f.write(f'force_fetch={force_fetch}\n')
          "

  test_matrix:
    name: 测试站点 - ${{ matrix.target.name }}
    needs: prepare_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare_matrix.outputs.targets) }}

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 恢复代理缓存 (Actions Cache)
        uses: actions/cache/restore@v4
        with:
          path: cache/
          key: proxy-test-cache-latest

      - name: 运行单站点代理测试
        env:
          PROXY_VERIFY_WORKERS: 250
        run: |
          TARGET_COUNT="${{ needs.prepare_matrix.outputs.target_count }}"
          FORCE_FETCH="${{ needs.prepare_matrix.outputs.force_fetch }}"
          
          FETCH_FLAG=""
          if [ "$FORCE_FETCH" = "true" ]; then
            FETCH_FLAG="-f"
          fi
          
          python cli.py -u "${{ matrix.target.url }}" -c "$TARGET_COUNT" $FETCH_FLAG

      - name: 上传单站点测试产物
        uses: actions/upload-artifact@v4
        with:
          name: site-result-${{ matrix.target.source }}
          path: data/sites/
          retention-days: 1

  aggregate_and_commit:
    name: 聚合多站数据并提交推送
    needs: [prepare_matrix, test_matrix]
    if: always() && needs.prepare_matrix.result == 'success' && (needs.test_matrix.result == 'success' || needs.test_matrix.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 下载各站点测试产物
        uses: actions/download-artifact@v4
        with:
          pattern: site-result-*
          path: data/sites
          merge-multiple: true

      - name: 合并各站点测试结果
        run: |
          python cli.py --merge

      - name: 删除旧的 Actions Cache (避免堆积)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CACHE_ID=$(gh actions cache list --key proxy-test-cache-latest --repo ${{ github.repository }} --json id --jq '.[0].id' 2>/dev/null || echo "")
          if [ -n "$CACHE_ID" ]; then
            gh actions cache delete "$CACHE_ID" --repo ${{ github.repository }}
            echo "已删除旧缓存 (ID: $CACHE_ID)"
          fi

      - name: 保存最新的代理缓存 (Actions Cache)
        uses: actions/cache/save@v4
        with:
          path: cache/
          key: proxy-test-cache-latest

      - name: 提交并推送最新代理数据到 Git 仓库
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "代理数据无变化，跳过提交"
          else
            git commit -m "chore(proxies): Matrix 并发测试自动更新可用代理列表 [skip ci]"
            git push origin main
          fi

      - name: 上传最终全量数据产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: proxy-data-latest
          path: data/
          retention-days: 30
